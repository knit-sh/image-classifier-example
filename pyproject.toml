[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cifar-cnn"
version = "0.1.0"
description = "Configurable CNN image classifier trained on CIFAR-10/100"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "pillow>=10.0",
]

[project.scripts]
cifar-cnn = "cifar_cnn.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cifar_cnn"]
